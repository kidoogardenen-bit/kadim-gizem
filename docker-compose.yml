services:
  app:
    container_name: kadim-gizem
    build:
      context: .
      dockerfile: Dockerfile
    image: kadim-gizem:latest
    restart: unless-stopped
    networks:
      - coolify
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://kadim:${DB_PASSWORD:-KadimGizem2026Strong}@db:5432/kadim_gizem
      AUTH_SECRET: ${AUTH_SECRET:-YlZ8XnP3qK9wVbR6tH4jL2mN5sD8fG7aQxC1uE0oA9iZ}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://kadimgizem.com}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://kadimgizem.com}
      NEXT_PUBLIC_SITE_NAME: "Kadim Gizem"
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    volumes:
      - ./public/covers:/app/public/covers
      - ./public/uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.kadim-gzip.compress=true"
      - "traefik.http.middlewares.kadim-redir.redirectscheme.scheme=https"
      - "traefik.http.routers.kadim-http-0.rule=Host(`kadimgizem.com`)"
      - "traefik.http.routers.kadim-http-0.entryPoints=http"
      - "traefik.http.routers.kadim-http-0.middlewares=kadim-redir"
      - "traefik.http.routers.kadim-http-0.service=kadim-http-0"
      - "traefik.http.routers.kadim-http-1.rule=Host(`www.kadimgizem.com`)"
      - "traefik.http.routers.kadim-http-1.entryPoints=http"
      - "traefik.http.routers.kadim-http-1.middlewares=kadim-redir"
      - "traefik.http.routers.kadim-http-1.service=kadim-http-1"
      - "traefik.http.routers.kadim-https-0.rule=Host(`kadimgizem.com`)"
      - "traefik.http.routers.kadim-https-0.entryPoints=https"
      - "traefik.http.routers.kadim-https-0.middlewares=kadim-gzip"
      - "traefik.http.routers.kadim-https-0.service=kadim-https-0"
      - "traefik.http.routers.kadim-https-0.tls=true"
      - "traefik.http.routers.kadim-https-0.tls.certresolver=letsencrypt"
      - "traefik.http.routers.kadim-https-1.rule=Host(`www.kadimgizem.com`)"
      - "traefik.http.routers.kadim-https-1.entryPoints=https"
      - "traefik.http.routers.kadim-https-1.middlewares=kadim-gzip"
      - "traefik.http.routers.kadim-https-1.service=kadim-https-1"
      - "traefik.http.routers.kadim-https-1.tls=true"
      - "traefik.http.routers.kadim-https-1.tls.certresolver=letsencrypt"
      - "traefik.http.services.kadim-http-0.loadbalancer.server.port=3000"
      - "traefik.http.services.kadim-http-1.loadbalancer.server.port=3000"
      - "traefik.http.services.kadim-https-0.loadbalancer.server.port=3000"
      - "traefik.http.services.kadim-https-1.loadbalancer.server.port=3000"

  db:
    container_name: kadim-gizem-db
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - coolify
    environment:
      POSTGRES_DB: kadim_gizem
      POSTGRES_USER: kadim
      POSTGRES_PASSWORD: ${DB_PASSWORD:-KadimGizem2026Strong}
    volumes:
      - kadim_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kadim -d kadim_gizem"]
      interval: 10s
      timeout: 5s
      retries: 5

  cloudflared:
    container_name: kadim-cloudflared
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    networks:
      - coolify
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
    depends_on:
      - app

networks:
  coolify:
    external: true

volumes:
  kadim_db_data:
    name: kadim_gizem_db_data
